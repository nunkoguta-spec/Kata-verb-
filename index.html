<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konjugator 800 Kata Kerja Bahasa Jerman</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent-sep: #ef4444;
      --tag-bg: #f1f5f9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 12px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      background: var(--card-bg);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 720px;
    }

    header { text-align: center; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; color: var(--text); margin-bottom: 6px; }
    p.subtitle { font-size: 0.9rem; color: var(--muted); }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus { border-color: var(--primary); }

    button.btn-search {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    button.btn-search:hover { background-color: var(--primary-hover); }

    .filter-section { margin-bottom: 20px; }
    
    .category-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-filter {
      padding: 6px 12px;
      border: 1px solid var(--border);
      background: var(--tag-bg);
      color: var(--text);
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-filter.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .filter-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .tags-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fafafa;
    }

    .tag {
      background: #ffffff;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .tag:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .result-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-top: 10px;
    }

    .verb-header {
      background: #f8fafc;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 10px;
    }

    .verb-title { font-size: 1.3rem; font-weight: 700; }
    .verb-meaning { font-size: 0.95rem; color: var(--muted); margin-top: 2px; }
    .verb-article { font-size: 0.85rem; color: var(--primary); font-weight: 600; margin-left: 8px; }
    .verb-translation { font-size: 0.9rem; color: var(--text); margin-top: 2px; }

    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .badge-regular { background: #dcfce7; color: #166534; }
    .badge-irregular { background: #fee2e2; color: #991b1b; }
    .badge-modal { background: #fef3c7; color: #92400e; }
    .badge-separable { background: #e0e7ff; color: #3730a3; }

    table { width: 100%; border-collapse: collapse; }
    td {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }

    tr:last-child td { border-bottom: none; }
    .pronoun { color: var(--muted); width: 35%; }
    .conjugation { font-weight: 600; }
    .highlight-ending { color: var(--primary); }
    .highlight-sep { color: var(--accent-sep); font-weight: bold; }

    .audio-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      margin-left: 8px;
    }

    .translation-toggle {
      background: none;
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s;
    }

    .translation-toggle:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .translation-row td {
      background: #f8fafc;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 6px 16px;
      border-bottom: 1px solid var(--border);
    }

    .translation-row td:last-child {
      font-weight: 500;
      color: var(--text);
    }

    .tag-article {
      font-size: 0.7rem;
      color: var(--muted);
      margin-left: 2px;
    }
  </style>
</head>

<div class="app-container">

  </div>

  <div class="filter-section">

</div>

    "vorlegen","wachsen","widersprechen","würdigen","zusammenfassen","zustimmen","zweifeln",
    "abschließen","anerkennen","ansteigen","aufnehmen","ausdrücken","ausschließen","beeindrucken","begreifen","bestehen",
    "einfallen","entsprechen","erfahren","ermutigen","erschrecken","erzwingen","festhalten","hinweisen","nachgeben",
    "teilnehmen","übernehmen","unternehmen","vorhaben","weitergeben","zusammenarbeiten","zuschauen","zugehören"
  ];

  // Dynamic filling to secure exactly 800 items
  let targetTotal = 800;
  let currentCount = Object.keys(verbDatabase).length;
  
  for (let i = 0; i < regularBaseList.length && currentCount < targetTotal; i++) {
    let verb = regularBaseList[i];
    if (!verbDatabase[verb]) {
      let translation = verbTranslations[verb] ? verbTranslations[verb].translation : "kata kerja teratur";
      verbDatabase[verb] = { meaning: translation, type: "regular" };
      if (!verbTranslations[verb]) {
        verbTranslations[verb] = { article: "", translation: translation };
      }
      currentCount++;
    }
  }

  // Fungsi untuk mendapatkan terjemahan dan artikel
  function getVerbTranslation(verb) {
    if (verbTranslations[verb]) {
      return verbTranslations[verb];
    }
    if (verbDatabase[verb] && verbDatabase[verb].meaning) {
      return { article: "", translation: verbDatabase[verb].meaning };
    }
    return { article: "", translation: "kata kerja teratur" };
  }

  let currentCategory = 'all';

  function filterVerbs(category, btnElement) {
    currentCategory = category;
    document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
    if (btnElement) btnElement.classList.add('active');
    renderTags();
  }

  function renderTags() {
    const tagsGrid = document.getElementById('tagsGrid');
    const tagCount = document.getElementById('tagCount');
    tagsGrid.innerHTML = '';

    let keys = Object.keys(verbDatabase);

    if (currentCategory !== 'all') {
      keys = keys.filter(verb => verbDatabase[verb].type === currentCategory);
    }

    tagCount.innerText = `Daftar Kata Kerja (${keys.length} kata):`;

    keys.forEach(verb => {
      const tag = document.createElement('span');
      tag.className = 'tag';
      const trans = getVerbTranslation(verb);
      const articleDisplay = trans.article ? `<span class="tag-article">${trans.article}</span> ` : '';
      tag.innerHTML = `${articleDisplay}${verb}`;
      tag.title = trans.translation;
      tag.onclick = () => {
        document.getElementById('verbInput').value = verb;
        conjugate();
      };
      tagsGrid.appendChild(tag);
    });
  }

  function speakText(text) {
    if ('speechSynthesis' in window) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'de-DE';
      window.speechSynthesis.speak(utterance);
    }
  }

  function conjugate() {
    let input = document.getElementById('verbInput').value.trim().toLowerCase();
    const resultDiv = document.getElementById('result');

    if (!input) {
      resultDiv.innerHTML = "<p style='color:red; text-align:center;'>Masukkan kata kerja terlebih dahulu.</p>";
      return;
    }

    let verbData = verbDatabase[input];
    let type = verbData ? verbData.type : "regular";
    let meaning = verbData ? verbData.meaning : "kata kerja teratur";
    let forms = {};

    const translationData = getVerbTranslation(input);
    const article = translationData.article;
    const translation = translationData.translation;

    if (verbData && verbData.forms) {
      forms = verbData.forms;
    } else {
      let stem = input;
      if (input.endsWith('en')) stem = input.slice(0, -2);
      else if (input.endsWith('n')) stem = input.slice(0, -1);

      let needsExtraE = stem.endsWith('t') || stem.endsWith('d') || stem.endsWith('m') || stem.endsWith('n') && !stem.endsWith('ln') && !stem.endsWith('rn');
      let extraE = needsExtraE ? 'e' : '';
      let isSpecialS = stem.endsWith('s') || stem.endsWith('ß') || stem.endsWith('z');
      let duEnding = isSpecialS ? 't' : (extraE + 'st');

      forms = {
        "ich": stem + "e",
        "du": stem + duEnding,
        "er/sie/es": stem + extraE + "t",
        "wir": stem + (input.endsWith('en') ? "en" : "n"),
        "ihr": stem + extraE + "t",
        "sie/Sie": stem + (input.endsWith('en') ? "en" : "n")
      };
    }

    let badgeClass = "badge-regular";
    let badgeText = "Regular Verb";

    if (type === "irregular") { badgeClass = "badge-irregular"; badgeText = "Irregular Verb"; }
    else if (type === "modal") { badgeClass = "badge-modal"; badgeText = "Modalverb"; }
    else if (type === "separable") { badgeClass = "badge-separable"; badgeText = "Trennbares Verb"; }

    let articleDisplay = article ? `<span class="verb-article">${article}</span>` : '';
    let translationDisplay = translation ? `<div class="verb-translation">🇮🇩 ${translation}</div>` : '';

    let html = `
      <div class="result-card">
        <div class="verb-header">
          <div>
            <div class="verb-title">${input} ${articleDisplay}
              <button class="audio-btn" onclick="speakText('${input}')" title="Dengarkan Pengucapan">🔊</button>
            </div>
            <div class="verb-meaning">Artinya: ${meaning}</div>
            ${translationDisplay}
          </div>
          <span class="badge ${badgeClass}">${badgeText}</span>
        </div>
        <table>
    `;

    for (let pronoun in forms) {
      let formText = forms[pronoun];
      let formattedText = formText;

      if (type === "regular") {
        let stemLength = input.endsWith('en') ? input.length - 2 : input.length - 1;
        let baseStem = input.substring(0, stemLength);
        if (formText.startsWith(baseStem)) {
          let ending = formText.substring(baseStem.length);
          formattedText = `${baseStem}<span class="highlight-ending">${ending}</span>`;
        }
      } else if (type === "separable") {
        let parts = formText.split(' ');
        if (parts.length > 1) {
          formattedText = `${parts[0]} <span class="highlight-sep">${parts[1]}</span>`;
        }
      }

      html += `
        <tr>
          <td class="pronoun">${pronoun}</td>
          <td class="conjugation">${formattedText} 
            <button class="audio-btn" onclick="speakText('${pronoun} ${formText}')" title="Dengarkan">🔊</button>
          </td>
        </tr>
      `;
    }

    html += `</table></div>`;
    resultDiv.innerHTML = html;
  }

  renderTags();
  conjugate();
</script>
